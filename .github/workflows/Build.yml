name: Build 6V6Cloud APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Tao project Android
        run: |
          mkdir -p proj/app/src/main/java/com/khoidz/cloudphone proj/app/src/main/assets
          mkdir -p proj/app/src/main/res/mipmap-xxxhdpi
          cp icon.png proj/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp index.html proj/app/src/main/assets/index.html
          cp MainActivity.java proj/app/src/main/java/com/khoidz/cloudphone/MainActivity.java
          cat > proj/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "6V6Cloud"
          include ':app'
          EOF
          cat > proj/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > proj/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.khoidz.cloudphone'
              compileSdk 34
              defaultConfig {
                  applicationId "com.khoidz.cloudphone"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          EOF
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="6V6Cloud" android:icon="@mipmap/ic_launcher" android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - name: Build APK
        run: |
          cd proj && gradle assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/6V6Cloud.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 6V6Cloud
          path: proj/app/build/outputs/apk/debug/6V6Cloud.apk
          
